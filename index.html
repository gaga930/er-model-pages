<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ER Model · UDP / 獎金系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg0: #f0f4f8; --bg1: #e2eaf2; --ink: #0f1c2e; --muted: #5a6b7d;
  --line: #c5d0dc; --accent: #0d7377; --dim: #2563eb; --dwd: #c2410c;
  --dws: #7c3aed; --shadow: 0 8px 30px rgba(15,28,46,.08);
  --font: "IBM Plex Sans TC","Noto Sans TC",sans-serif;
  --mono: "IBM Plex Mono",ui-monospace,monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--ink);
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, #c8e6e8 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 0%, #d4e0f0 0%, transparent 45%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  grid-template-rows: auto auto 1fr;
  height: 100vh;
}
header {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 22px 8px;
  background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 { font-size: 1.3rem; font-weight: 700; }
.brand h1 span { color: var(--accent); }
.brand .sub { font-size: .85rem; color: var(--muted); }
.stats { display: flex; gap: 16px; font-size: .8rem; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--mono); font-weight: 500; }

.tabs {
  grid-column: 1 / -1;
  display: flex; gap: 4px; padding: 0 22px;
  background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.tab {
  border: none; background: transparent; font: inherit;
  padding: 10px 18px 12px; cursor: pointer; color: var(--muted);
  font-weight: 500; font-size: .92rem; position: relative;
  border-radius: 8px 8px 0 0;
}
.tab:hover { color: var(--ink); background: rgba(13,115,119,.06); }
.tab.active { color: var(--accent); font-weight: 600; }
.tab.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: 0;
  height: 3px; background: var(--accent); border-radius: 3px 3px 0 0;
}
.tab .count {
  font-family: var(--mono); font-size: .72rem; margin-left: 6px;
  background: var(--bg0); padding: 1px 6px; border-radius: 999px; color: var(--muted);
}
.tab.active .count { background: #e8f4f4; color: var(--accent); }

.sidebar, .detail {
  background: rgba(255,255,255,.85); backdrop-filter: blur(10px);
  overflow-y: auto; padding: 16px;
}
.sidebar { border-right: 1px solid var(--line); }
.detail { border-left: 1px solid var(--line); }
.section-title {
  font-size: .72rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin: 14px 0 8px;
}
.section-title:first-child { margin-top: 0; }
.search {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; font: inherit; font-size: .9rem; background: #fff; outline: none;
}
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,115,119,.15); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flow-chip {
  font-size: .72rem; padding: 4px 8px; border-radius: 6px;
  background: #e8f4f4; color: var(--accent); font-weight: 500;
}
.flow-arrow { color: var(--muted); font-size: .7rem; }
.chk {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px;
  border-radius: 8px; cursor: pointer; font-size: .88rem; user-select: none;
}
.chk:hover { background: var(--bg0); }
.chk input { accent-color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.entity-mini { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
.entity-mini button {
  text-align: left; border: none; background: transparent; padding: 6px 8px;
  border-radius: 6px; cursor: pointer; font: inherit; font-size: .82rem;
  color: var(--ink); display: flex; justify-content: space-between; gap: 8px;
}
.entity-mini button:hover, .entity-mini button.active { background: #e8f4f4; color: var(--accent); }
.entity-mini .ename { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

.canvas-wrap {
  position: relative; overflow: hidden;
  background:
    linear-gradient(rgba(15,28,46,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,28,46,.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
#stage { width: 100%; height: 100%; cursor: grab; }
#stage.dragging { cursor: grabbing; }
.toolbar {
  position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap;
}
.toolbar button, .toolbar label {
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font: inherit; font-size: .8rem; cursor: pointer; box-shadow: var(--shadow);
}
.toolbar button:hover { border-color: var(--accent); color: var(--accent); }
.toolbar label { display: flex; align-items: center; gap: 6px; }
.legend {
  position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,.92);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
  font-size: .75rem; display: flex; gap: 14px; flex-wrap: wrap; box-shadow: var(--shadow); z-index: 5;
}
.legend span { display: flex; align-items: center; gap: 6px; }
.lg-box { width: 14px; height: 10px; border-radius: 2px; border: 2px solid; }

.detail-empty { color: var(--muted); font-size: .9rem; padding: 24px 8px; text-align: center; line-height: 1.6; }
.detail h2 { font-size: 1.15rem; margin-bottom: 4px; }
.detail .tid { font-family: var(--mono); font-size: .82rem; color: var(--accent); margin-bottom: 12px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.badge {
  font-size: .72rem; padding: 3px 8px; border-radius: 999px;
  background: var(--bg0); color: var(--muted); font-weight: 500;
}
.badge.layer-dim, .badge.layer-ods { background: #dbeafe; color: #1d4ed8; }
.badge.layer-dwd, .badge.layer-mon { background: #ffedd5; color: #c2410c; }
.badge.layer-dws { background: #ede9fe; color: #6d28d9; }
.badge.layer-app { background: #d1fae5; color: #047857; }
.badge.layer-ctl, .badge.layer-recon { background: #e2e8f0; color: #475569; }
.badge.core { background: #fef3c7; color: #b45309; }
.meta-row { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.meta-row code {
  font-family: var(--mono); font-size: .78rem; color: var(--ink);
  background: var(--bg0); padding: 1px 5px; border-radius: 4px;
}
.col-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 8px; }
.col-table th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: .7rem;
  letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: #fff;
}
.col-table td { padding: 6px 4px; border-bottom: 1px solid #eef2f6; vertical-align: top; }
.col-table .cname { font-family: var(--mono); font-size: .75rem; color: var(--accent); white-space: nowrap; }
.col-table .pk { color: #b45309; font-weight: 600; }
.rel-list { list-style: none; margin-top: 8px; }
.rel-list li { font-size: .8rem; padding: 6px 0; border-bottom: 1px solid #eef2f6; color: var(--muted); }
.rel-list code { font-family: var(--mono); font-size: .75rem; color: var(--ink); }
.rel-list a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }
.rel-list a:hover { text-decoration: underline; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 240px 1fr; }
  .detail { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>ER <span>Model</span></h1>
      <div class="sub" id="subtitle">資料倉儲實體關係圖</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" class="tab active" data-model="udp">UDP 資料倉儲 <span class="count" id="cnt-udp"></span></button>
    <button type="button" class="tab" data-model="bonus">獎金系統 <span class="count" id="cnt-bonus"></span></button>
  </nav>

  <aside class="sidebar">
    <div class="section-title">搜尋</div>
    <input class="search" id="search" type="search" placeholder="搜尋實體（會一併顯示關聯表）…" />

    <div class="section-title">主流程</div>
    <div class="flow" id="flowMain"></div>
    <div class="flow" id="flowExtra" style="margin-top:6px"></div>

    <div class="section-title" id="coreSectionTitle" style="display:none">範圍</div>
    <div id="coreFilter" style="display:none">
      <label class="chk"><input type="checkbox" id="coreOnly" checked />僅顯示核心表（建議）</label>
    </div>

    <div class="section-title">資料域</div>
    <div id="domainFilters"></div>

    <div class="section-title">資料層</div>
    <div id="layerFilters"></div>

    <div class="section-title">關聯類型</div>
    <label class="chk"><input type="checkbox" id="showFk" checked />外鍵 / 業務關聯</label>
    <label class="chk"><input type="checkbox" id="showLineage" />血緣 / 對照 (lineage)</label>

    <div class="section-title">實體列表</div>
    <div class="entity-mini" id="entityList"></div>
  </aside>

  <main class="canvas-wrap">
    <div class="toolbar">
      <button type="button" id="btnFit">適合畫面</button>
      <button type="button" id="btnReset">重置佈局</button>
      <button type="button" id="btnZoomIn">＋</button>
      <button type="button" id="btnZoomOut">－</button>
      <label><input type="checkbox" id="showCols" checked />顯示欄位</label>
    </div>
    <div class="legend" id="legend"></div>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <aside class="detail" id="detail">
    <div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯</div>
  </aside>
</div>

const svg = document.getElementById("stage");
const NS = "http://www.w3.org/2000/svg";

function model() { return MODELS[state.modelId]; }

function el(tag, attrs={}, children=[]) {
  const n = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "textContent") n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) n.appendChild(c);
  return n;
}

function domainColor(domain) {
  const d = model().domains[domain];
  return (d && d.color) || "#64748b";
}

function pkSet(id) {
  return new Set((model().pkHints && model().pkHints[id]) || []);
}

function relatedIds(entityId) {
  const ids = new Set([entityId]);
  for (const r of model().relationships) {
    if (r.from === entityId) ids.add(r.to);
    if (r.to === entityId) ids.add(r.from);
  }
  return ids;
}

function entityMatchesSearch(e, q, raw) {
  if (!q) return true;
  if (e.name.toLowerCase().includes(q) || (e.label||"").toLowerCase().includes(q) || (e.label||"").includes(raw)) return true;
  return (e.columns||[]).some(c => c.name.toLowerCase().includes(q) || (c.comment||"").includes(raw));
}

function visibleEntities() {
  const m = model();
  const raw = state.search.trim();
  const q = raw.toLowerCase();
  const core = m.coreIds ? new Set(m.coreIds) : null;

  // base pool by domain / layer / core filters
  let pool = m.entities.filter(e => {
    if (state.coreOnly && core && !core.has(e.id) && !e.isCore) return false;
    if (!state.domains.has(e.domain)) return false;
    if (!state.layers.has(e.layer) && e.layer !== "other") return false;
    return true;
  });

  if (!q) return pool;

  // matched entities (search also looks outside core filter so related hits aren't missed)
  const matched = m.entities.filter(e => entityMatchesSearch(e, q, raw));
  if (!matched.length) return [];

  // expand to neighbors via any relationship
  const keep = new Set();
  for (const e of matched) {
    for (const id of relatedIds(e.id)) keep.add(id);
  }
  // when searching, show matched + related even if outside current domain/layer/core filters
  return m.entities.filter(e => keep.has(e.id));
}

function visibleRels(ents) {
  const ids = new Set(ents.map(e => e.id));
  const searchMode = !!state.search.trim();
  return model().relationships.filter(r => {
    if (!ids.has(r.from) || !ids.has(r.to)) return false;
    // while searching, show all relationship kinds among the kept neighborhood
    if (searchMode) return true;
    if (r.kind === "fk" && !state.showFk) return false;
    if (r.kind === "lineage" && !state.showLineage) return false;
    return true;
  });
}

function measureBox(ent) {
  const maxShow = state.showCols ? Math.min((ent.columns||[]).length, 10) : 0;
  const w = 230;
  const h = 36 + maxShow * 18 + ((ent.columns||[]).length > 10 ? 18 : 0) + 8;
  return { w, h, maxCols: maxShow };
}

function layoutEntities(ents) {
  const domainOrder = Object.keys(model().domains);
  const byDomain = {};
  for (const e of ents) (byDomain[e.domain] ||= []).push(e);
  for (const d of Object.keys(byDomain)) {
    byDomain[d].sort((a,b) => a.name.localeCompare(b.name));
  }
  const colW = 290;
  const gapY = 22;
  let col = 0;
  const ordered = [...domainOrder, ...Object.keys(byDomain).filter(d => !domainOrder.includes(d))];
  for (const d of ordered) {
    const list = byDomain[d];
    if (!list || !list.length) continue;
    let y = 20;
    const x = 30 + col * colW;
    for (const e of list) {
      const { h } = measureBox(e);
      if (!state.positions[e.id] || state.positions[e.id]._auto) {
        state.positions[e.id] = { x, y, _auto: true };
      }
      y += h + gapY;
    }
    col++;
  }
}

  const ents = visibleEntities();
  layoutEntities(ents);
  const rels = visibleRels(ents);
  const entMap = Object.fromEntries(ents.map(e => [e.id, e]));

      el("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#0d7377" })

  ]), gRoot);

  for (const r of rels) {

    gEdges.appendChild(el("path", {

      opacity: isFk ? "0.75" : "0.45",
      "marker-end": isFk ? "url(#arrowFk)" : "url(#arrow)",
      "pointer-events": "none",
    }));
  }

  for (const e of ents) {
    const pos = state.positions[e.id];
    const { w, h, maxCols } = measureBox(e);
    const colors = layerColor(e.layer);
    const selected = state.selected === e.id;
    const g = el("g", { class: "node", transform: `translate(${pos.x},${pos.y})`, "data-id": e.id, style: "cursor:pointer" });
    g.appendChild(el("rect", { width: w, height: h, rx: 8, ry: 8, fill: colors.fill, stroke: selected ? "#0d7377" : colors.stroke, "stroke-width": selected ? 2.5 : 1.5 }));
    g.appendChild(el("rect", { width: 5, height: h, rx: 2, fill: domainColor(e.domain) }));
    g.appendChild(el("rect", { x: 5, width: w-5, height: 34, fill: colors.head }));
    g.appendChild(el("text", { x: 14, y: 15, "font-size": "11", "font-family": "IBM Plex Mono, monospace", fill: colors.stroke, "font-weight": "600", textContent: e.name }));
    g.appendChild(el("text", { x: 14, y: 28, "font-size": "10", fill: "#5a6b7d", textContent: (e.label||"").slice(0,18) }));

    if (state.showCols && maxCols > 0) {
      const pks = pkSet(e.id);
      (e.columns||[]).slice(0, maxCols).forEach((c, i) => {
        const isPk = pks.has(c.name);
        const yy = 48 + i * 18;
        g.appendChild(el("text", {
          x: 14, y: yy, "font-size": "10", "font-family": "IBM Plex Mono, monospace",
          fill: isPk ? "#b45309" : "#0d7377", "font-weight": isPk ? "600" : "400",
          textContent: (isPk ? "🔑 " : "") + c.name,
        }));
        const cmt = (c.comment||"").replace(/^VARCHAR.*/i,"").replace(/^DECIMAL.*/i,"").replace(/^DATE.*/i,"").replace(/^INT.*/i,"").replace(/^DATETIME.*/i,"").slice(0,10);
        if (cmt) g.appendChild(el("text", { x: w-10, y: yy, "font-size": "9", fill: "#94a3b8", "text-anchor": "end", textContent: cmt }));
      });
      if ((e.columns||[]).length > maxCols) {
        g.appendChild(el("text", { x: 14, y: 48 + maxCols*18, "font-size": "9", fill: "#94a3b8", textContent: `…另有 ${e.columns.length - maxCols} 欄` }));
      }
    }

    g.addEventListener("mousedown", (ev) => {
      ev.stopPropagation();
      state.draggingNode = e.id;
      state.lastX = ev.clientX; state.lastY = ev.clientY;
      selectEntity(e.id);
    });
    gNodes.appendChild(g);
  }

  renderEntityList(ents);
}

function renderEntityList(ents) {
  const box = document.getElementById("entityList");
  box.innerHTML = ents.map(e => `
    <button type="button" data-id="${e.id}" class="${state.selected===e.id?'active':''}">
      <span>${e.label||e.name}</span>
      <span class="ename">${e.name}</span>
    </button>
  `).join("");
  box.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => selectEntity(btn.dataset.id)));
}

function selectEntity(id) {
  state.selected = id;
  const e = model().entities.find(x => x.id === id);
  const panel = document.getElementById("detail");
  if (!e) {
    panel.innerHTML = `<div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯</div>`;
    render(); return;
  }
  const pks = pkSet(e.id);
  const rels = model().relationships.filter(r => r.from === id || r.to === id);
  const outR = rels.filter(r => r.from === id);
  const inR = rels.filter(r => r.to === id);
  const cols = e.columns || [];
  const neighborCount = relatedIds(id).size - 1;

  panel.innerHTML = `
    <h2>${e.label||e.name}</h2>
    <div class="tid">${e.full_name || e.name}</div>
    <div class="badges">
      <span class="badge">${e.domain}</span>
      <span class="badge layer-${e.layer}">${e.layer}</span>
      <span class="badge">${cols.length} 欄位</span>
      ${e.isCore || (model().coreIds||[]).includes(e.id) ? '<span class="badge core">核心</span>' : ''}
      ${e.system === 'legacy' ? '<span class="badge">舊系統</span>' : ''}
      ${e.system === 'new' ? '<span class="badge">新系統</span>' : ''}
      <span class="badge">關聯 ${neighborCount} 張表</span>
    </div>
    ${(e.sources||[]).length ? `<div class="meta-row">來源：${e.sources.map(s=>`<code>${s}</code>`).join(" ")}</div>` : ""}
    ${(e.depends_on||[]).length ? `<div class="meta-row">依賴：${e.depends_on.map(d=>`<code>${d}</code>`).join(" ")}</div>` : ""}

    <div class="section-title">欄位${cols.length>80?`（顯示前 80 / 共 ${cols.length}）`:''}</div>
    <table class="col-table">
      <thead><tr><th>欄位</th><th>說明</th></tr></thead>
      <tbody>
        ${cols.slice(0,80).map(c => `
          <tr>
            <td class="cname ${pks.has(c.name)?'pk':''}">${pks.has(c.name)?'🔑 ':''}${c.name}</td>
            <td>${c.comment || "—"}</td>
          </tr>`).join("")}
      </tbody>
    </table>

    <div class="section-title">連出 (${outR.length})</div>
    <ul class="rel-list">
      ${outR.length ? outR.map(r => `<li>${r.label||r.kind} → <a data-goto="${r.to}">${r.to}</a>
        ${r.fromCol?`<code>${r.fromCol}</code>`:''} <span style="opacity:.6">[${r.kind}]</span></li>`).join("") : "<li>無</li>"}
    </ul>
    <div class="section-title">連入 (${inR.length})</div>
    <ul class="rel-list">
      ${inR.length ? inR.map(r => `<li><a data-goto="${r.from}">${r.from}</a> → ${r.label||r.kind}
        <span style="opacity:.6">[${r.kind}]</span></li>`).join("") : "<li>無</li>"}
    </ul>
  `;
  panel.querySelectorAll("[data-goto]").forEach(a => {
    a.addEventListener("click", () => selectEntity(a.dataset.goto));
  });
  render();
}

function layersInModel() {
  return [...new Set(model().entities.map(e => e.layer))];
}

function rebuildSidebar() {
  const m = model();
  document.getElementById("subtitle").textContent = m.subtitle || "";
  const s = m.stats;
  document.getElementById("stats").innerHTML = `
    <span>實體 <b>${s.entityCount}</b></span>
    <span>關聯 <b>${s.relCount}</b></span>
    <span>欄位 <b>${s.colCount}</b></span>
    ${s.newCount!=null?`<span>新 <b>${s.newCount}</b></span>`:""}
    ${s.legacyCount!=null?`<span>舊 <b>${s.legacyCount}</b></span>`:""}
  `;

  document.getElementById("flowMain").innerHTML = (m.flow||[]).map((x,i)=>
    (i?`<span class="flow-arrow">→</span>`:"") + `<span class="flow-chip">${x}</span>`
  ).join("");
  document.getElementById("flowExtra").innerHTML = (m.flowExtra||[]).map(x=>
    `<span class="flow-chip">${x}</span>`
  ).join("");

  const hasCore = !!(m.coreIds && m.coreIds.length);
  document.getElementById("coreSectionTitle").style.display = hasCore ? "" : "none";
  document.getElementById("coreFilter").style.display = hasCore ? "" : "none";
  state.coreOnly = hasCore ? !!m.defaultShowCoreOnly : false;
  document.getElementById("coreOnly").checked = state.coreOnly;

  state.domains = new Set(Object.keys(m.domains));
  const box = document.getElementById("domainFilters");
  box.innerHTML = Object.entries(m.domains).map(([k,v]) => `
    <label class="chk"><input type="checkbox" data-domain="${k}" checked />
    <span class="dot" style="background:${v.color}"></span>${v.label||k}</label>
  `).join("");
  box.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      if (inp.checked) state.domains.add(inp.dataset.domain);
      else state.domains.delete(inp.dataset.domain);
      clearAutoPos(); render();
    });
  });

  const layers = layersInModel();
  state.layers = new Set(layers);
  const lb = document.getElementById("layerFilters");
  lb.innerHTML = layers.map(l => {
    const meta = LAYER_META[l] || { label: l, color: "#94a3b8" };
    return `<label class="chk"><input type="checkbox" data-layer="${l}" checked />
      <span class="dot" style="background:${meta.color}"></span>${meta.label}</label>`;
  }).join("");
  lb.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      if (inp.checked) state.layers.add(inp.dataset.layer);
      else state.layers.delete(inp.dataset.layer);
      clearAutoPos(); render();
    });
  });

  document.getElementById("legend").innerHTML = layers.slice(0,6).map(l => {
    const c = layerColor(l);
    const meta = LAYER_META[l] || { label: l };
    return `<span><i class="lg-box" style="border-color:${c.stroke};background:${c.head}"></i>${meta.label}</span>`;
  }).join("") + `<span>搜尋可帶出關聯表 · 清空還原 · 拖曳平移</span>`;
}

function clearAutoPos() {
  Object.keys(state.positions).forEach(k => { if (state.positions[k]._auto) delete state.positions[k]; });
}

function switchModel(id) {
  if (!MODELS[id] || state.modelId === id) return;
  state.modelId = id;
  state.selected = null;
  state.positions = {};
  state.scale = 1; state.panX = 40; state.panY = 40;
  state.search = "";
  document.getElementById("search").value = "";
  document.getElementById("detail").innerHTML = `<div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯<br/><span style="font-size:.8rem;opacity:.8">搜尋框可篩出實體及其關聯表</span></div>`;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.model === id));
  rebuildSidebar();
  render();
  setTimeout(fitView, 60);
}

function fitView() {
  const ents = visibleEntities();
  if (!ents.length) return;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const e of ents) {
    const p = state.positions[e.id]; const {w,h}=measureBox(e);
    if (!p) continue;
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x+w); maxY=Math.max(maxY,p.y+h);
  }
  const wrap = document.querySelector(".canvas-wrap");
  const vw = wrap.clientWidth-80, vh = wrap.clientHeight-80;
  const bw = maxX-minX+40, bh = maxY-minY+40;
  state.scale = Math.min(1.15, Math.max(0.28, Math.min(vw/bw, vh/bh)));
  state.panX = 40 - minX*state.scale + (vw - bw*state.scale)/2;
  state.panY = 50 - minY*state.scale;
  render();
}

// events
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchModel(t.dataset.model)));
document.getElementById("coreOnly").addEventListener("change", e => { state.coreOnly = e.target.checked; clearAutoPos(); render(); setTimeout(fitView,40); });
document.getElementById("showFk").addEventListener("change", e => { state.showFk = e.target.checked; render(); });
document.getElementById("showLineage").addEventListener("change", e => { state.showLineage = e.target.checked; render(); });
document.getElementById("showCols").addEventListener("change", e => { state.showCols = e.target.checked; clearAutoPos(); render(); });
document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  clearAutoPos();
  render();
  setTimeout(fitView, 40);
});
document.getElementById("btnFit").addEventListener("click", fitView);
document.getElementById("btnReset").addEventListener("click", () => {
  state.selected = null;
  state.search = "";
  document.getElementById("search").value = "";
  state.positions={}; state.scale=1; state.panX=40; state.panY=40;
  document.getElementById("detail").innerHTML = `<div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯</div>`;
  render(); setTimeout(fitView,40);
});
document.getElementById("btnZoomIn").addEventListener("click", () => { state.scale=Math.min(2.5,state.scale*1.15); render(); });
document.getElementById("btnZoomOut").addEventListener("click", () => { state.scale=Math.max(0.25,state.scale/1.15); render(); });

svg.addEventListener("mousedown", (ev) => {
  if (ev.target === svg || ev.target.id === "viewport" || ev.target.id === "edges" || ev.target.tagName === "path") {
    state.panning = true;
    state.lastX = ev.clientX; state.lastY = ev.clientY;
    svg.classList.add("dragging");
  }
});
window.addEventListener("mousemove", (ev) => {
  const dx = ev.clientX-state.lastX, dy = ev.clientY-state.lastY;
  state.lastX = ev.clientX; state.lastY = ev.clientY;
  if (state.draggingNode) {
    const p = state.positions[state.draggingNode];
    p.x += dx/state.scale; p.y += dy/state.scale; p._auto = false; render();
  } else if (state.panning) {
    state.panX += dx; state.panY += dy;
    const vp = document.getElementById("viewport");
    if (vp) vp.setAttribute("transform", `translate(${state.panX},${state.panY}) scale(${state.scale})`);
  }
});
window.addEventListener("mouseup", () => {
  state.draggingNode = null;
  state.panning = false;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX-rect.left, my = ev.clientY-rect.top;
  const delta = ev.deltaY>0 ? 0.9 : 1.1;
  const newScale = Math.min(2.5, Math.max(0.25, state.scale*delta));
  const wx = (mx-state.panX)/state.scale, wy = (my-state.panY)/state.scale;
  state.scale = newScale;
  state.panX = mx - wx*state.scale; state.panY = my - wy*state.scale;
  const vp = document.getElementById("viewport");
  if (vp) vp.setAttribute("transform", `translate(${state.panX},${state.panY}) scale(${state.scale})`);
}, { passive: false });

// init
document.getElementById("cnt-udp").textContent = MODELS.udp.stats.entityCount;
document.getElementById("cnt-bonus").textContent = MODELS.bonus.stats.entityCount;
rebuildSidebar();
render();
setTimeout(fitView, 80);
</script>
</body>
</html>
