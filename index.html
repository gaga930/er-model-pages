<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UDP 資料倉儲 ER Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg0: #f0f4f8;
  --bg1: #e2eaf2;
  --panel: #ffffff;
  --ink: #0f1c2e;
  --muted: #5a6b7d;
  --line: #c5d0dc;
  --accent: #0d7377;
  --accent-dim: #14919b;
  --dim: #2563eb;
  --dwd: #c2410c;
  --dws: #7c3aed;
  --shadow: 0 8px 30px rgba(15, 28, 46, 0.08);
  --radius: 12px;
  --font: "IBM Plex Sans TC", "Noto Sans TC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, #c8e6e8 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 0%, #d4e0f0 0%, transparent 45%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 280px 1fr 340px;
  grid-template-rows: auto 1fr;
  height: 100vh;
  gap: 0;
}
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.brand h1 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.brand h1 span { color: var(--accent); }
.brand .sub {
  font-size: 0.85rem;
  color: var(--muted);
}
.stats {
  display: flex;
  gap: 18px;
  font-size: 0.8rem;
  color: var(--muted);
}
.stats b {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-weight: 500;
}
.sidebar, .detail {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 16px;
}
.detail { border-right: none; border-left: 1px solid var(--line); }
.section-title {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 14px 0 8px;
}
.section-title:first-child { margin-top: 0; }
.search {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font: inherit;
  font-size: 0.9rem;
  background: #fff;
  outline: none;
}
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,115,119,0.15); }
.flow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 4px;
}
.flow-chip {
  font-size: 0.72rem;
  padding: 4px 8px;
  border-radius: 6px;
  background: #e8f4f4;
  color: var(--accent);
  font-weight: 500;
}
.flow-arrow { color: var(--muted); font-size: 0.7rem; }
.domain-list, .layer-list { display: flex; flex-direction: column; gap: 4px; }
.chk {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.88rem;
  user-select: none;
}
.chk:hover { background: var(--bg0); }
.chk input { accent-color: var(--accent); }
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.entity-mini {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 280px;
  overflow-y: auto;
}
.entity-mini button {
  text-align: left;
  border: none;
  background: transparent;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font: inherit;
  font-size: 0.82rem;
  color: var(--ink);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.entity-mini button:hover,
.entity-mini button.active { background: #e8f4f4; color: var(--accent); }
.entity-mini .ename { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.canvas-wrap {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(rgba(15,28,46,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,28,46,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
#stage {
  width: 100%;
  height: 100%;
  cursor: grab;
}
#stage.dragging { cursor: grabbing; }
.toolbar {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
.toolbar button, .toolbar label {
  background: rgba(255,255,255,0.92);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
  font: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.toolbar button:hover { border-color: var(--accent); color: var(--accent); }
.toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.legend {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(255,255,255,0.92);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.75rem;
  display: flex;
  gap: 14px;
  box-shadow: var(--shadow);
  z-index: 5;
}
.legend span { display: flex; align-items: center; gap: 6px; }
.lg-box {
  width: 14px; height: 10px; border-radius: 2px; border: 2px solid;
}
.detail-empty {
  color: var(--muted);
  font-size: 0.9rem;
  padding: 24px 8px;
  text-align: center;
  line-height: 1.6;
}
.detail h2 {
  font-size: 1.15rem;
  margin-bottom: 4px;
}
.detail .tid {
  font-family: var(--mono);
  font-size: 0.82rem;
  color: var(--accent);
  margin-bottom: 12px;
}
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.badge {
  font-size: 0.72rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg0);
  color: var(--muted);
  font-weight: 500;
}
.badge.layer-dim { background: #dbeafe; color: #1d4ed8; }
.badge.layer-dwd { background: #ffedd5; color: #c2410c; }
.badge.layer-dws { background: #ede9fe; color: #6d28d9; }
.meta-row {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 6px;
}
.meta-row code {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--ink);
  background: var(--bg0);
  padding: 1px 5px;
  border-radius: 4px;
}
.col-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
  margin-top: 8px;
}
.col-table th {
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  padding: 6px 4px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: #fff;
}
.col-table td {
  padding: 6px 4px;
  border-bottom: 1px solid #eef2f6;
  vertical-align: top;
}
.col-table .cname {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  white-space: nowrap;
}
.col-table .pk { color: #b45309; font-weight: 600; }
.rel-list { list-style: none; margin-top: 8px; }
.rel-list li {
  font-size: 0.8rem;
  padding: 6px 0;
  border-bottom: 1px solid #eef2f6;
  color: var(--muted);
}
.rel-list code { font-family: var(--mono); font-size: 0.75rem; color: var(--ink); }
.rel-list a {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 500;
}
.rel-list a:hover { text-decoration: underline; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 240px 1fr; }
  .detail { display: none; }
  .detail.open-mobile {
    display: block;
    position: absolute;
    right: 0; top: 56px; bottom: 0;
    width: min(340px, 90vw);
    z-index: 20;
    box-shadow: var(--shadow);
  }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>UDP <span>ER Model</span></h1>
      <div class="sub">資料倉儲實體關係圖 · 由 ETL 定義自動產生</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="sidebar">
    <div class="section-title">搜尋</div>
    <input class="search" id="search" type="search" placeholder="表名、欄位、中文…" />

    <div class="section-title">業務主流程</div>
    <div class="flow">
      <span class="flow-chip">銷售單</span><span class="flow-arrow">→</span>
      <span class="flow-chip">出貨單</span><span class="flow-arrow">→</span>
      <span class="flow-chip">應收單</span><span class="flow-arrow">→</span>
      <span class="flow-chip">收款單</span>
    </div>
    <div class="flow" style="margin-top:6px">
      <span class="flow-chip">管報收入</span>
      <span class="flow-arrow">·</span>
      <span class="flow-chip">獎金</span>
      <span class="flow-arrow">·</span>
      <span class="flow-chip">基本維度</span>
    </div>

    <div class="section-title">資料域</div>
    <div class="domain-list" id="domainFilters"></div>

    <div class="section-title">資料層</div>
    <div class="layer-list" id="layerFilters">
      <label class="chk"><input type="checkbox" data-layer="dim" checked /><span class="dot" style="background:var(--dim)"></span>維度 dim_*</label>
      <label class="chk"><input type="checkbox" data-layer="dwd" checked /><span class="dot" style="background:var(--dwd)"></span>明細 dwd_*</label>
      <label class="chk"><input type="checkbox" data-layer="dws" checked /><span class="dot" style="background:var(--dws)"></span>彙總 dws_*</label>
    </div>

    <div class="section-title">關聯類型</div>
    <label class="chk"><input type="checkbox" id="showFk" checked />外鍵關聯 (FK)</label>
    <label class="chk"><input type="checkbox" id="showLineage" />ETL 依賴 (lineage)</label>

    <div class="section-title">實體列表</div>
    <div class="entity-mini" id="entityList"></div>
  </aside>

  <main class="canvas-wrap">
    <div class="toolbar">
      <button type="button" id="btnFit">適合畫面</button>
      <button type="button" id="btnReset">重置佈局</button>
      <button type="button" id="btnZoomIn">＋</button>
      <button type="button" id="btnZoomOut">－</button>
      <label><input type="checkbox" id="showCols" checked />顯示欄位</label>
    </div>
    <div class="legend">
      <span><i class="lg-box" style="border-color:var(--dim);background:#dbeafe"></i>維度</span>
      <span><i class="lg-box" style="border-color:var(--dwd);background:#ffedd5"></i>明細事實</span>
      <span><i class="lg-box" style="border-color:var(--dws);background:#ede9fe"></i>彙總</span>
      <span>拖曳空白處平移 · 滾輪縮放 · 點擊實體查看詳情</span>
    </div>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <aside class="detail" id="detail">
    <div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯</div>
  </aside>
</div>

  showCols: true,
  search: "",
  selected: null,
  scale: 1,
  panX: 40,
  panY: 40,
  positions: {},
  draggingNode: null,
  panning: false,
  lastX: 0,
  lastY: 0,
};

const svg = document.getElementById("stage");
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs={}, children=[]) {
  const n = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "textContent") n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) n.appendChild(c);
  return n;
}

function layerColor(layer) {
  if (layer === "dim") return { stroke: "#2563eb", fill: "#eff6ff", head: "#dbeafe" };
  if (layer === "dwd") return { stroke: "#c2410c", fill: "#fff7ed", head: "#ffedd5" };
  if (layer === "dws") return { stroke: "#6d28d9", fill: "#f5f3ff", head: "#ede9fe" };
  return { stroke: "#64748b", fill: "#f8fafc", head: "#e2e8f0" };
}

function domainColor(domain) {
  return (DATA.domains[domain] && DATA.domains[domain].color) || "#64748b";
}

function visibleEntities() {
  const q = state.search.trim().toLowerCase();
  return DATA.entities.filter(e => {
    if (!state.domains.has(e.domain)) return false;
    if (!state.layers.has(e.layer) && e.layer !== "other") return false;
    if (e.layer === "other" && !state.layers.has("other") && ![...state.layers].some(l => l === e.layer)) {
      // allow other if any layer checked - treat other as always with dim
    }
    if (!q) return true;
    if (e.name.toLowerCase().includes(q) || e.label.includes(q) || e.label.toLowerCase().includes(q)) return true;
    return e.columns.some(c => c.name.toLowerCase().includes(q) || (c.comment||"").includes(q));
  });
}

function visibleRels(ents) {
  const ids = new Set(ents.map(e => e.id));
  return DATA.relationships.filter(r => {
    if (!ids.has(r.from) || !ids.has(r.to)) return false;
    if (r.kind === "fk" && !state.showFk) return false;
    if (r.kind === "lineage" && !state.showLineage) return false;
    return true;
  });
}

function measureBox(ent) {
  const maxCols = state.showCols ? Math.min(ent.columns.length, 12) : 0;
  const w = 220;
  const h = 36 + maxCols * 18 + (ent.columns.length > 12 ? 18 : 0) + 8;
  return { w, h, maxCols };
}

function layoutEntities(ents) {
  const domainOrder = ["基本維度","銷售單","出貨單","應收單","收款單","財務單據","管報收入","獎金"];
  const byDomain = {};
  for (const e of ents) {
    (byDomain[e.domain] ||= []).push(e);
  }
  for (const d of Object.keys(byDomain)) {
    byDomain[d].sort((a,b) => {
      const la = {dim:0,dwd:1,dws:2,other:3}[a.layer] ?? 4;
      const lb = {dim:0,dwd:1,dws:2,other:3}[b.layer] ?? 4;
      return la - lb || a.name.localeCompare(b.name);
    });
  }

  const colW = 280;
  const gapY = 24;
  let col = 0;
  for (const d of domainOrder) {
    const list = byDomain[d];
    if (!list || !list.length) continue;
    let y = 20;
    const x = 30 + col * colW;
    for (const e of list) {
      const { w, h } = measureBox(e);
      if (!state.positions[e.id] || state.positions[e.id]._auto) {
        state.positions[e.id] = { x, y, _auto: true };
      }
      y += h + gapY;
    }
    col++;
  }
  // leftover domains
  for (const d of Object.keys(byDomain)) {
    if (domainOrder.includes(d)) continue;
    let y = 20;
    const x = 30 + col * colW;
    for (const e of byDomain[d]) {
      const { h } = measureBox(e);
      if (!state.positions[e.id] || state.positions[e.id]._auto) {
        state.positions[e.id] = { x, y, _auto: true };
      }
      y += h + gapY;
    }
    col++;
  }
}

function render() {
  const ents = visibleEntities();
  layoutEntities(ents);
  const rels = visibleRels(ents);
  const entMap = Object.fromEntries(ents.map(e => [e.id, e]));

  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const gRoot = el("g", { id: "viewport", transform: `translate(${state.panX},${state.panY}) scale(${state.scale})` });
  const gEdges = el("g", { id: "edges" });
  const gNodes = el("g", { id: "nodes" });
  gRoot.appendChild(gEdges);
  gRoot.appendChild(gNodes);
  svg.appendChild(gRoot);

  // defs for arrow
  const defs = el("defs", {}, [
    el("marker", { id: "arrow", markerWidth: "8", markerHeight: "8", refX: "7", refY: "3", orient: "auto" }, [
      el("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#94a3b8" })
    ]),
    el("marker", { id: "arrowFk", markerWidth: "8", markerHeight: "8", refX: "7", refY: "3", orient: "auto" }, [
      el("path", { d: "M0,0 L7,3 L0,6 Z", fill: "#0d7377" })
    ]),
  ]);
  svg.insertBefore(defs, gRoot);

  // edges
  for (const r of rels) {
    const a = state.positions[r.from];
    const b = state.positions[r.to];
    if (!a || !b) continue;
    const ea = entMap[r.from], eb = entMap[r.to];
    const ba = measureBox(ea), bb = measureBox(eb);
    const x1 = a.x + ba.w / 2, y1 = a.y + ba.h / 2;
    const x2 = b.x + bb.w / 2, y2 = b.y + bb.h / 2;
    const isFk = r.kind === "fk";
    const path = el("path", {
      d: `M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`,
      fill: "none",
      stroke: isFk ? "#0d7377" : "#94a3b8",
      "stroke-width": isFk ? "1.6" : "1.2",
      "stroke-dasharray": isFk ? "none" : "5 4",
      opacity: isFk ? "0.75" : "0.45",
      "marker-end": isFk ? "url(#arrowFk)" : "url(#arrow)",
      "pointer-events": "none",
    });
    gEdges.appendChild(path);
  }

  // nodes
  for (const e of ents) {
    const pos = state.positions[e.id];
    const { w, h, maxCols } = measureBox(e);
    const colors = layerColor(e.layer);
    const selected = state.selected === e.id;
    const g = el("g", {
      class: "node",
      transform: `translate(${pos.x},${pos.y})`,
      "data-id": e.id,
      style: "cursor:pointer",
    });

    g.appendChild(el("rect", {
      width: w, height: h, rx: 8, ry: 8,
      fill: colors.fill, stroke: selected ? "#0d7377" : colors.stroke,
      "stroke-width": selected ? 2.5 : 1.5,
      filter: selected ? "" : "",
    }));
    // accent bar
    g.appendChild(el("rect", {
      width: 5, height: h, rx: 2,
      fill: domainColor(e.domain),
    }));
    // header
    g.appendChild(el("rect", {
      x: 5, width: w - 5, height: 34,
      fill: colors.head,
    }));
    g.appendChild(el("text", {
      x: 14, y: 15, "font-size": "11", "font-family": "IBM Plex Mono, monospace",
      fill: colors.stroke, "font-weight": "600", textContent: e.name,
    }));
    g.appendChild(el("text", {
      x: 14, y: 28, "font-size": "10", fill: "#5a6b7d", textContent: e.label,
    }));

    if (state.showCols && maxCols > 0) {
      const pks = new Set(PK_HINTS[e.id] || []);
      e.columns.slice(0, maxCols).forEach((c, i) => {
        const isPk = pks.has(c.name);
        const yy = 48 + i * 18;
        g.appendChild(el("text", {
          x: 14, y: yy,
          "font-size": "10",
          "font-family": "IBM Plex Mono, monospace",
          fill: isPk ? "#b45309" : "#0d7377",
          "font-weight": isPk ? "600" : "400",
          textContent: (isPk ? "🔑 " : "") + c.name,
        }));
        const cmt = (c.comment || "").slice(0, 10);
        if (cmt) {
          g.appendChild(el("text", {
            x: w - 10, y: yy, "font-size": "9", fill: "#94a3b8",
            "text-anchor": "end", textContent: cmt,
          }));
        }
      });
      if (e.columns.length > maxCols) {
        g.appendChild(el("text", {
          x: 14, y: 48 + maxCols * 18,
          "font-size": "9", fill: "#94a3b8",
          textContent: `…另有 ${e.columns.length - maxCols} 欄`,
        }));
      }
    }

    g.addEventListener("mousedown", (ev) => {
      ev.stopPropagation();
      state.draggingNode = e.id;
      state.lastX = ev.clientX;
      state.lastY = ev.clientY;
      selectEntity(e.id);
    });
    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      selectEntity(e.id);
    });

    gNodes.appendChild(g);
  }

  renderEntityList(ents);
}

function renderEntityList(ents) {
  const box = document.getElementById("entityList");
  box.innerHTML = ents.map(e => `
    <button type="button" data-id="${e.id}" class="${state.selected===e.id?'active':''}">
      <span>${e.label}</span>
      <span class="ename">${e.name}</span>
    </button>
  `).join("");
  box.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => selectEntity(btn.dataset.id));
  });
}

function selectEntity(id) {
  state.selected = id;
  const e = DATA.entities.find(x => x.id === id);
  const panel = document.getElementById("detail");
  if (!e) {
    panel.innerHTML = `<div class="detail-empty">點擊圖上的實體<br/>查看欄位與關聯</div>`;
    render();
    return;
  }
  const pks = new Set(PK_HINTS[e.id] || []);
  const rels = DATA.relationships.filter(r => r.from === id || r.to === id);
  const outR = rels.filter(r => r.from === id);
  const inR = rels.filter(r => r.to === id);

  panel.innerHTML = `
    <h2>${e.label}</h2>
    <div class="tid">${e.full_name || "udp." + e.name}</div>
    <div class="badges">
      <span class="badge">${e.domain}</span>
      <span class="badge layer-${e.layer}">${e.layer}</span>
      <span class="badge">${e.columns.length} 欄位</span>
    </div>
    <div class="meta-row">來源腳本：${(e.sources||[]).map(s => `<code>${s}</code>`).join(" ")}</div>
    ${(e.depends_on||[]).length ? `<div class="meta-row">依賴表：${e.depends_on.map(d => `<code>${d}</code>`).join(" ")}</div>` : ""}

    <div class="section-title">欄位</div>
    <table class="col-table">
      <thead><tr><th>欄位</th><th>說明</th></tr></thead>
      <tbody>
        ${e.columns.map(c => `
          <tr>
            <td class="cname ${pks.has(c.name)?'pk':''}">${pks.has(c.name)?'🔑 ':''}${c.name}</td>
            <td>${c.comment || "—"}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <div class="section-title">連出關聯 (${outR.length})</div>
    <ul class="rel-list">
      ${outR.length ? outR.map(r => `
        <li>${r.label || r.kind} → <a data-goto="${r.to}">${r.to}</a>
          ${r.fromCol ? `<code>${r.fromCol}</code> → <code>${r.toCol}</code>` : ""}
          <span style="opacity:.6">[${r.kind}]</span>
        </li>`).join("") : "<li>無</li>"}
    </ul>

    <div class="section-title">連入關聯 (${inR.length})</div>
    <ul class="rel-list">
      ${inR.length ? inR.map(r => `
        <li><a data-goto="${r.from}">${r.from}</a> → ${r.label || r.kind}
          ${r.fromCol ? `<code>${r.fromCol}</code>` : ""}
          <span style="opacity:.6">[${r.kind}]</span>
        </li>`).join("") : "<li>無</li>"}
    </ul>
  `;
  panel.querySelectorAll("[data-goto]").forEach(a => {
    a.addEventListener("click", () => {
      selectEntity(a.dataset.goto);
      const p = state.positions[a.dataset.goto];
      if (p) {
        state.panX = window.innerWidth / 2 - (p.x + 110) * state.scale;
        state.panY = 120 - p.y * state.scale;
      }
      render();
    });
  });
  render();
}

function initFilters() {
  const box = document.getElementById("domainFilters");
  box.innerHTML = Object.entries(DATA.domains).map(([k,v]) => `
    <label class="chk">
      <input type="checkbox" data-domain="${k}" checked />
      <span class="dot" style="background:${v.color}"></span>${v.label}
    </label>
  `).join("");
  box.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      if (inp.checked) state.domains.add(inp.dataset.domain);
      else state.domains.delete(inp.dataset.domain);
      Object.keys(state.positions).forEach(k => { if (state.positions[k]._auto) delete state.positions[k]; });
      render();
    });
  });
  document.querySelectorAll("#layerFilters input").forEach(inp => {
    inp.addEventListener("change", () => {
      if (inp.checked) state.layers.add(inp.dataset.layer);
      else state.layers.delete(inp.dataset.layer);
      Object.keys(state.positions).forEach(k => { if (state.positions[k]._auto) delete state.positions[k]; });
      render();
    });
  });
  document.getElementById("showFk").addEventListener("change", e => { state.showFk = e.target.checked; render(); });
  document.getElementById("showLineage").addEventListener("change", e => { state.showLineage = e.target.checked; render(); });
  document.getElementById("showCols").addEventListener("change", e => {
    state.showCols = e.target.checked;
    Object.keys(state.positions).forEach(k => { if (state.positions[k]._auto) delete state.positions[k]; });
    render();
  });
  document.getElementById("search").addEventListener("input", e => {
    state.search = e.target.value;
    render();
  });

  const s = DATA.stats;
  document.getElementById("stats").innerHTML = `
    <span>實體 <b>${s.entityCount}</b></span>
    <span>關聯 <b>${s.relCount}</b></span>
    <span>欄位 <b>${s.colCount}</b></span>
    <span>ETL <b>${s.sourceCount}</b></span>
    <span>資料域 <b>${s.domainCount}</b></span>
  `;
}

function fitView() {
  const ents = visibleEntities();
  if (!ents.length) return;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const e of ents) {
    const p = state.positions[e.id];
    const { w, h } = measureBox(e);
    if (!p) continue;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + w); maxY = Math.max(maxY, p.y + h);
  }
  const wrap = document.querySelector(".canvas-wrap");
  const vw = wrap.clientWidth - 80, vh = wrap.clientHeight - 80;
  const bw = maxX - minX + 40, bh = maxY - minY + 40;
  state.scale = Math.min(1.2, Math.max(0.35, Math.min(vw / bw, vh / bh)));
  state.panX = 40 - minX * state.scale + (vw - bw * state.scale) / 2;
  state.panY = 50 - minY * state.scale;
  render();
}

// pan / zoom / drag
svg.addEventListener("mousedown", (ev) => {
  if (ev.target === svg || ev.target.id === "viewport" || ev.target.id === "edges") {
    state.panning = true;
    state.lastX = ev.clientX;
    state.lastY = ev.clientY;
    svg.classList.add("dragging");
  }
});
window.addEventListener("mousemove", (ev) => {
  const dx = ev.clientX - state.lastX;
  const dy = ev.clientY - state.lastY;
  state.lastX = ev.clientX;
  state.lastY = ev.clientY;
  if (state.draggingNode) {
    const p = state.positions[state.draggingNode];
    p.x += dx / state.scale;
    p.y += dy / state.scale;
    p._auto = false;
    render();
  } else if (state.panning) {
    state.panX += dx;
    state.panY += dy;
    const vp = document.getElementById("viewport");
    if (vp) vp.setAttribute("transform", `translate(${state.panX},${state.panY}) scale(${state.scale})`);
  }
});
window.addEventListener("mouseup", () => {
  state.draggingNode = null;
  state.panning = false;
  svg.classList.remove("dragging");
});
svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const delta = ev.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(2.5, Math.max(0.25, state.scale * delta));
  const wx = (mx - state.panX) / state.scale;
  const wy = (my - state.panY) / state.scale;
  state.scale = newScale;
  state.panX = mx - wx * state.scale;
  state.panY = my - wy * state.scale;
  const vp = document.getElementById("viewport");
  if (vp) vp.setAttribute("transform", `translate(${state.panX},${state.panY}) scale(${state.scale})`);
}, { passive: false });

document.getElementById("btnFit").addEventListener("click", fitView);
document.getElementById("btnReset").addEventListener("click", () => {
  state.positions = {};
  state.scale = 1;
  state.panX = 40;
  state.panY = 40;
  render();
  setTimeout(fitView, 50);
});
document.getElementById("btnZoomIn").addEventListener("click", () => { state.scale = Math.min(2.5, state.scale * 1.15); render(); });
document.getElementById("btnZoomOut").addEventListener("click", () => { state.scale = Math.max(0.25, state.scale / 1.15); render(); });

initFilters();
render();
setTimeout(fitView, 80);
</script>
</body>
</html>
